<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MagLens 登录</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 16px; }
  form { width: 100%; max-width: 340px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 28px 24px; box-shadow: 0 8px 30px rgba(0,0,0,.06); }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--accent); letter-spacing: .04em; }
  p.sub { margin: 0 0 22px; color: var(--ink3); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--ink2); margin: 14px 0 6px; }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--ink); font: inherit; font-size: 15px; }
  input:focus { outline: none; border-color: var(--ink3); }
  button { width: 100%; margin-top: 22px; padding: 9px; font-size: 15px; }
  .err { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 12px; }
</style>
</head>
<body>
<form id="f">
  <h1>MagLens</h1>
  <p class="sub">日文杂志 · 中文对照阅读</p>
  <label for="name">用户名</label>
  <input id="name" autocomplete="username" autocapitalize="off" required autofocus>
  <label for="pw">密码</label>
  <input id="pw" type="password" autocomplete="current-password" required>
  <button class="primary" type="submit">登录</button>
  <div class="err" id="err"></div>
</form>
<script>
"use strict";
const f = document.getElementById("f"), err = document.getElementById("err");
fetch("/api/me").then(r => r.json()).then(me => { if (me.user) location.replace("/"); }).catch(() => {});
f.onsubmit = async e => {
  e.preventDefault(); err.textContent = "";
  const btn = f.querySelector("button"); btn.disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: document.getElementById("name").value, password: document.getElementById("pw").value }) });
    if (r.ok) return location.replace("/");
    err.textContent = r.status === 401 ? "用户名或密码不对" : "登录失败（" + r.status + "）";
  } catch { err.textContent = "连不上服务器"; }
  btn.disabled = false;
};
</script>
</body>
</html>
