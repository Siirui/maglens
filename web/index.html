<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffdf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24221f" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>MagLens</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MagLens">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <a id="home" href="#/" aria-label="MagLens 首页">
    <svg class="logo-icon" viewBox="0 0 96 96" aria-hidden="true">
      <rect width="96" height="96" rx="24" fill="#E0442B"/>
      <rect x="18" y="14" width="44" height="58" rx="5" fill="#FFF8EC" transform="rotate(-7 42 44)"/>
      <circle cx="62" cy="60" r="21" fill="#2D5BE3" stroke="#FFF8EC" stroke-width="7"/>
    </svg>
    <span class="wordmark">MagLens</span>
    <span class="kana" aria-hidden="true">マグレンズ</span>
  </a>
  <div id="crumb"><select id="magsel" title="切换杂志"></select><span id="magname" hidden></span></div>
  <div id="tools" hidden>
    <div class="seg" id="mode">
      <button data-mode="zh">中文</button><button data-mode="bi">对照</button><button data-mode="ja">原文</button>
    </div>
    <button id="btn-tap" class="phone-only" title="点页面上的文字，就地弹出译文">点读</button>
    <button id="btn-spread" title="单页 / 跨页 (S)">跨页</button>
    <button id="btn-dir" title="装订方向">右翻</button>
    <button id="btn-boxes" class="admin-only" title="在页面上显示所有文本框 (B)">显示框</button>
    <button id="btn-select" class="admin-only needs-model" title="框选一块区域重新识别 (R)">框选识别</button>
    <button id="btn-retry" class="admin-only needs-model" title="重新识别翻译当前页">重译</button>
    <button id="btn-gloss" class="admin-only">术语表</button>
    <a id="btn-export" class="admin-only" target="_blank">导出</a>
  </div>
  <div id="status"></div>
  <div id="user"></div>
</header>
<div id="progress" hidden>
  <div class="ptext" id="ptext"></div>
  <div class="pbar"><i id="pbar-all"></i></div>
</div>

<main id="shelf" hidden>
  <div class="wrap">
    <div id="a2hs" hidden><span>当 App 用：在 Safari 点<b>分享</b> → <b>添加到主屏幕</b></span><button type="button" aria-label="知道了">×</button></div>
    <div id="continue"></div>
    <div id="grid"></div>
    <div id="shelf-head"></div>
  </div>
</main>

<main id="reader" hidden>
  <section id="left">
    <div id="stage"><div id="pages"></div></div>
    <nav id="pager">
      <div class="seg" id="fit" title="页面显示方式">
        <button data-fit="page" title="整页放进窗口 (1)">整页</button><button data-fit="width" title="宽度撑满，上下滚动 (2)">适应宽度</button><button data-fit="height" title="高度撑满，左右滚动 (3)">适应高度</button><button data-fit="fill" title="铺满窗口，多出的部分滚动查看 (4)">铺满</button>
      </div>
      <span class="grow"></span>
      <button id="prev">‹</button>
      <input id="pageinput" type="number" min="1"> <span id="pagetotal"></span>
      <button id="next">›</button>
      <span class="grow"></span>
      <div class="zoom">
        <button id="zoom-out" title="缩小 (−)">−</button>
        <button id="zoom-reset" title="恢复 100% (0)">100%</button>
        <button id="zoom-in" title="放大 (+)">+</button>
      </div>
    </nav>
    <div id="thumbs"></div>
  </section>
  <div id="divider"></div>
  <section id="right">
    <div id="grab" role="button" tabindex="0" aria-label="拖动或点按，调整译文面板的高度">
      <div class="peek">
        <button id="sh-prev" aria-label="向左翻页">‹</button>
        <span id="peek-text">译文</span>
        <span id="peek-page"></span>
        <button id="sh-next" aria-label="向右翻页">›</button>
      </div>
    </div>
    <div id="panel"></div>
  </section>
</main>

<dialog id="gloss">
  <form method="dialog">
    <h2>术语表 <small id="gloss-series"></small></h2>
    <p class="hint">同一系列（如所有 POPEYE）共用一份术语表。模型遇到新的专有名词会自动加进来；你改过的条目会被锁定，后面的页面都按它翻译。</p>
    <input id="gloss-filter" placeholder="搜索…">
    <div id="gloss-table"></div>
    <div class="row">
      <button type="button" id="gloss-add">+ 添加</button>
      <span class="grow"></span>
      <button value="cancel">取消</button>
      <button type="button" id="gloss-save" class="primary">保存</button>
    </div>
  </form>
</dialog>
<dialog id="users">
  <form method="dialog">
    <h2>账号管理</h2>
    <p class="hint">读者只能看已经翻完的杂志，看不到管理功能和花费；「可看」可以把账号限制在某一期（比如公开发出去的试读账号）。新账号的密码只在这里显示一次，复制后发给对方即可；重置密码会让对方在所有设备上退出登录。</p>
    <div id="users-table"></div>
    <h3>新建账号</h3>
    <div class="uadd">
      <input id="ua-name" placeholder="用户名" autocomplete="off" maxlength="32">
      <input id="ua-pass" placeholder="密码（至少 8 位）" autocomplete="new-password">
      <button type="button" id="ua-gen" title="生成一个随机密码">随机</button>
      <select id="ua-role"><option value="reader">读者</option><option value="admin">管理员</option></select>
      <select id="ua-mags" title="这个账号能看哪些杂志"></select>
      <button type="button" id="ua-add" class="primary">创建</button>
    </div>
    <div id="users-msg" class="umsg" role="status"></div>
    <div class="row">
      <span class="grow"></span>
      <button value="cancel">关闭</button>
    </div>
  </form>
</dialog>
<dialog id="fbdlg">
  <form method="dialog">
    <h2>读者反馈</h2>
    <p class="hint">读者在阅读页底部提交的意见，最新的在最上面。点标题可以跳到那一页。</p>
    <div id="fb-table"></div>
    <div class="row"><span class="grow"></span><button value="cancel">关闭</button></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
